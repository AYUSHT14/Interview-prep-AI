services:
  - type: web
    name: interview-prep-app
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend --omit=dev && npm install --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: GROK_API_KEY
        sync: false